[project]
name = "alprime-rag-assistant"
version = "1.0.0"
description = "Grounded document question answering over PDF, DOCX and TXT files."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".venv", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C90"]
ignore = [
    "B008",  # FastAPI's `Depends(...)` / `File(...)` defaults are the framework idiom
]

[tool.ruff.lint.per-file-ignores]
# Prompt prose, sample-document text and evaluation questions read better unwrapped.
"app/services/prompts.py" = ["E501"]
"scripts/*.py" = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.isort]
known-first-party = ["app"]
